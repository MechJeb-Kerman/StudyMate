misconceptions:
  - topic: 奇数计数与整数开方（第1课·从一道蓝桥杯题说起）
    question: 1 到 ⌊√N⌋ 范围内有多少个奇数？
    misunderstanding: 用 `m // 2` 数奇数（上界为奇数时漏一个），且用 `n ** 0.5` / `math.sqrt` 浮点开方（大整数丢精度）。
    answer_summary: 奇数个数是 `(m + 1) // 2`；整数开方用 `math.isqrt`（整数问题别用浮点 sqrt）。
    importance: medium
  - topic: 标准输入输出的交互提示（第1课·从一道蓝桥杯题说起）
    question: input() 里的提示文字在评测机上会不会影响判分？
    misunderstanding: 以为 input("请输入…") 的提示只显示在人机交互时、不影响程序输出。
    answer_summary: input() 的 prompt 会原样写进 stdout，逐字比对时多答任何文字都判零分。竞赛里永远用不带提示参数的 input()。
    importance: high
