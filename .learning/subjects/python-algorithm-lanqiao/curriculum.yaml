    problem: '二分的思想简单到一句话，但边界写错是几乎所有初学者都会经历的事：死循环、多查一次、漏掉最后一个元素，而且往往只在某些数据上错。这课的价值在讲清循环不变式的写法——用"答案一定在闭区间里"这句话把每一行的边界条件推出来，而不是靠试。'
    practice: '讲练并重：分别写闭区间与左闭右开两种二分模板；用一组刻意挑出来的边界数据（空、单元素、全相同、目标在两端、目标不存在）逐一验证；再用 bisect 对照结果。'
