# Python 算法与蓝桥杯 · 课程大纲（DAG）
#
# 位次规则：nodes 的书写顺序即教学位次；prerequisites 与 edges 只允许指向前面的节点。
# 课型：概念=只讲不落 lab；实操=带自己的小 lab；实验=里程碑验收课（必须有非空 prerequisites）。
# 依据说明见同目录报告；未核实的来源不写进 resources。

nodes:
  # ===== 第一部分：什么叫算法，以及写算法要用的 Python =====

  - id: 'intro-what-is-algorithm'
    title: '从一道蓝桥杯题说起'
    kind: '概念'
    objective: '说出问题到程序的四步，并解释规模变大后暴力解为何失效'
    problem: '开场直接抛一道蓝桥杯填空题：从 1 加到一亿，手算不可能，写三行循环一秒出结果。再把这题改一个字——数据规模从一亿变成十亿——同一份代码就从"一秒出结果"变成"等到关闭窗口"。同一段代码，为什么这次不行了？这课的价值在讲清一件事：算法不是"会写循环"，而是在动手之前就知道这段代码要跑多久。'
    practice: '以讲为主：学生自己提出一个"想用程序算"的真实问题，当场把它拆成输入、处理、输出三段，并猜一猜数据变大十倍会怎样。'
    prerequisites: []
    concepts: ['问题建模', '输入与输出', '算法的定义', '数据规模与可行性']
    pitfalls: ['以为"能写出循环"就等于会算法', '第一次接触就以"我数学不好"自我劝退']
    realworld: '同一道题在评测机上通过或超时，区别常不在这段代码对不对，而在它属于哪一档复杂度。'
    resources:
      - title: '《Python 编程：从入门到实践（第 2 版）》第 4 章 操作列表（用循环处理一批数据）'
        type: 'book'
        url: 'reference/python-crash-course-2e.md'
      - title: '《算法（第 4 版）》第 1 章 基础（算法与数据结构的关系）'
        type: 'book'
    status: '未开始'
    mastery: 0

  - id: 'complexity-basics'
    title: '同一道题，两种写法'
    kind: '概念'
    objective: '能按数据规模估算运行时间，并判断一种写法会不会超时'
    problem: '蓝桥杯填空题常见形态：n 最大到 10 的 9 次方，时限 1 秒。学生写完代码的第一步通常是"拿样例试试"，而样例永远只有三五个数，永远跑得飞快——真正的问题在提交那一刻才暴露。这课的价值在讲清一套动手之前就能算的粗估办法：一秒能跑多少条基本操作，你的循环总共跑多少次。'
    practice: '以讲为主：给三道不同数据规模的题，学生先各自估"能不能在一秒内跑完"，再实际跑一遍对答案，估错的当场找出错在哪一步。'
    prerequisites: ['intro-what-is-algorithm']
    concepts: ['时间复杂度', '大 O 记号', '常数与数量级的区别', '空间复杂度', '数据规模反推复杂度上限']
    pitfalls: ['把 O(2n) 和 O(n) 当成两档不同复杂度', '只看样例通过就认为不会超时']
    realworld: '蓝桥杯每题都写明数据范围与时限，能否通过几乎在选题那一刻就定了。'
    resources:
      - title: '《算法导论（第 3 版）》第 3 章 函数的增长'
        type: 'book'
      - title: 'Python 官方文档 timeit —— 用实测验证你的估算'
        type: 'official-doc'
        url: 'https://docs.python.org/3/library/timeit.html'
      - title: '洛谷题单：入门与普及-（按数据规模挑题练估算）'
        type: 'article'
    status: '未开始'
    mastery: 0

  - id: 'python-list-dict-cost'
    title: '列表与字典的隐藏价格'
    kind: '实操'
    objective: '说出列表与字典各操作的复杂度，并在实现里选对容器'
    problem: '学生写题时最顺手的两件事是往列表末尾追加、在列表里查找某个元素，而这两件事在数据大十倍之后差别巨大。很多"代码没错但超时"的题，问题就出在一行 in 或者一次 pop(0) 上。这课的价值在练熟一个动作：写每行代码时心里知道它要花多少代价。'
    practice: '讲练并重：在 lab 里写一份小脚本，同一份数据用列表 in、集合 in 和字典查分别跑一遍，打印耗时并做成对照表；再用 pop(0) 与 deque 对照一次。'
    prerequisites: ['complexity-basics']
    concepts: ['列表索引与追加', '插入删除的代价', '集合与字典的哈希查找', '切片与拷贝的代价', '用实测对照估算']
    pitfalls: ['在循环里反复用列表 in 做查重', '把 pop(0) 当队列用', '忘了切片会复制一份新列表']
    realworld: '同一道统计题，把中间容器从列表换成一个集合，运行时间能差出两个数量级。'
    resources:
      - title: 'Python 官方文档 数据结构 —— 列表、集合、字典操作的时间复杂度'
        type: 'official-doc'
        url: 'https://docs.python.org/3/tutorial/datastructures.html'
    status: '未开始'
    mastery: 0

  - id: 'python-function-basics'
    title: '把一段代码变成函数'
    kind: '实操'
    objective: '能把重复代码抽成带参函数，说清参数、返回与作用域'
    problem: '算法题的题解动辄一百行，学生现在的写法是全部摊在一个文件里从上往下跑，改一处逻辑要翻三遍。DFS、BFS、二分这些算法写下去必然要反复调用同一段逻辑——没有函数，算法在手上根本伸不开。这课的价值在练熟一个动作：看见重复就抽成函数，看见参数就传进去、看见结果就返回回来。'
    practice: '讲练并重：把一道已做过的题从"一个文件从上往下"改写成"三四个函数各管一件事"，运行结果必须与原版完全一致；再故意用全局变量改一版，观察两种写法的差别。'
    prerequisites: ['python-list-dict-cost']
    concepts: ['函数定义与调用', '位置参数、默认参数与关键字参数', '返回值与元组返回', '局部与全局作用域', '函数内不要悄悄改外部列表']
    pitfalls: ['用全局变量在函数之间传状态', '可变默认参数被跨调用共享', '在函数里就地改传入的列表导致调用处数据被改坏']
    realworld: '同一份算法逻辑要同时用在小样例自测和正式提交上，只有抽成函数才能两边共用。'
    resources:
      - title: '《Python 编程：从入门到实践（第 2 版）》第 8 章 函数'
        type: 'book'
        url: 'reference/python-crash-course-2e.md'
      - title: 'Python 官方文档 定义函数'
        type: 'official-doc'
        url: 'https://docs.python.org/3/tutorial/controlflow.html#defining-functions'
    status: '未开始'
    mastery: 0

  - id: 'python-comprehension-builtins'
    title: '推导式与常用内置工具'
    kind: '实操'
    objective: '能用推导式与常用内置函数把一段循环压到一行'
    problem: '题解里常见 a = [int(x) for x in data]、sum(1 for x in a if x > 0) 这类写法，学生看得懂单个词却不敢自己写。这不是炫技：少写一层循环，就少一处下标写错的机会，题意也更清楚。这课的价值在练熟一批高频工具，并把最常用的十几个内置函数变成手感。'
    practice: '讲练并重：收集自己过去写过的十段循环，逐段改写成推导式或内置函数版本，结果必须一致；enumerate、zip、sorted(key=)、sum、max、any、all、map 各至少改一处。'
    prerequisites: ['python-function-basics']
    concepts: ['列表推导式', '带条件的推导式与嵌套推导式', '生成器表达式与惰性求值', 'zip 与 enumerate', 'sorted 的 key 参数', 'any 与 all']
    pitfalls: ['为了短把逻辑挤成一行看不懂的推导式', '对无穷生成器直接套 sum', 'sorted 与 list.sort 的返回值搞混（前者返回新表，后者返回 None）']
    realworld: '一道需要按第二关键字排序的模拟题，写对 key 只需要一行，写错比较函数要调半小时。'
    resources:
      - title: '《Python 编程：从入门到实践（第 2 版）》第 4 章 操作列表（列表解析）'
        type: 'book'
        url: 'reference/python-crash-course-2e.md'
      - title: 'Python 官方文档 内置函数'
        type: 'official-doc'
        url: 'https://docs.python.org/3/library/functions.html'
    status: '未开始'
    mastery: 0

  - id: 'python-io-and-debug'
    title: '读完输入再动手'
    kind: '实操'
    objective: '能稳定解析多行多元素输入，并用样例自查提交前的错误'
    problem: '蓝桥杯的输入格式千奇百怪：一行多个整数、多行若干元素、矩阵、带空行的数据块。学生现在大多靠 input() 一行一行处理，遇到"第一行 n m，接下来 n 行每行 m 个整数"就卡在第一步，算法一个字都没写到。这课的价值在练熟一个动作：先让输入完整、正确地落进数据结构，再谈算法。'
    practice: '讲练并重：备五组不同格式的样例（单行多整数、多行整数、矩阵、混合行列、末尾空行），每组都要求解析成指定的数据结构；再故意写错一处下标，用 print 定位并修好。'
    prerequisites: ['python-comprehension-builtins']
    concepts: ['sys.stdin 整体读入', '按空白切分与按行切分', '矩阵与二维列表的读法', '多组测试数据的循环处理', '用打印定位错误而不是靠猜']
    pitfalls: ['边读边算导致读指针错位', '把字符串当数字比较（"10" 小于 "9"）', '输入末尾有空行导致崩在最后一行']
    realworld: '同一道题在自测脚本里读文件和提交时读标准输入是两条路径，输入层写错会让人误以为是算法错了。'
    resources:
      - title: 'Python 官方文档 输入与输出'
        type: 'official-doc'
        url: 'https://docs.python.org/3/tutorial/inputoutput.html'
    status: '未开始'
    mastery: 0

  - id: 'lab-01-run-one-problem'
    title: '实验一：把一道题跑通'
    kind: '实验'
    objective: '做出 solve 脚本：解析输入、求解、跑通样例并打印结果'
    problem: '前六课学的是零件：循环、函数、推导式、输入解析、复杂度估算。零件不组装成一台能跑的机器，就不知道自己哪一块是空的。这次要把零件装起来，做出本课程第一个可运行产物——一份能读入题目输入、给出答案、并用样例自动判定对错的脚本。'
    practice: '以练为主：验收为主，代码与自测脚本都要交，讲解只针对卡住的那一步。'
    prerequisites: ['python-io-and-debug', 'python-function-basics', 'complexity-basics', 'python-list-dict-cost', 'python-comprehension-builtins']
    concepts: ['从题目到脚本的完整流程', '样例驱动的自测', '提交前自检']
    pitfalls: ['写完直接扔进大测试，样例错在哪都看不出', '只测一组样例就认为通过', '把"打印调试"当成唯一手段']
    realworld: '这份脚本正是 AI 刷题助手最底层的那一环：助手最后的验证能力，就是这个骨架长出来的。'
    resources:
      - title: '洛谷题单：入门与普及-（挑三道不同输入格式的题）'
        type: 'article'
    status: '未开始'
    mastery: 0

  - id: 'brute-force-to-optimization'
    title: '先把暴力写对'
    kind: '概念'
    objective: '能写出正确答案的暴力解，并据此估出可接受的复杂度上限'
    problem: '拿到一道题，很多人的第一反应是想最佳解法，结果既没写出最优解，也没写出能过小数据的暴力解，最后交了零分。考场上的正确顺序是反过来的：先用最直白的枚举拿到一个正确答案，再按数据范围决定它够不够快、要不要优化。这课的价值在讲清"暴力解既是保底分、也是对拍时的参考答案"这个双重身份。'
    practice: '以讲为主：挑两道题先各写一版暴力解，估出它的复杂度，再对照题目给的数据范围判断能拿几成分，最后才讨论优化方向。'
    prerequisites: ['lab-01-run-one-problem', 'complexity-basics']
    concepts: ['暴力枚举的写法', '用数据范围反推能拿多少分', '暴力解作为对拍参考', '部分分的价值']
    pitfalls: ['跳过暴力直接追最优解，最后两者都没写成', '暴力解复杂度都不估就交上去', '认为暴力解没有价值，其实它是对拍的基准']
    realworld: '蓝桥杯按测试点给分，暴力解往往能先拿到可观的分数，剩下一部分再靠优化挣。'
    resources:
      - title: '洛谷题单：入门与普及-（同一题的不同数据范围版本）'
        type: 'article'
    status: '未开始'
    mastery: 0

  # ===== 第二部分：两把基本武器——线性结构与递归 =====

  - id: 'linear-structures-two-pointers'
    title: '一维数据的两种走法'
    kind: '实操'
    objective: '能用前缀和与双指针把两层循环降成一层'
    problem: '蓝桥杯里最常见的超时写法就是两层循环——"对每个区间求一次和""对每对元素判断一次条件"。这些题的正确写法往往不是换更高级的算法，而是换一种走法：前缀和让区间和一步算出来，双指针让左右两个下标只往前不回头。这课的价值在练熟这两种走法，它们是后面所有优化技巧的起点。'
    practice: '讲练并重：同一道区间求和题分别写暴力版、前缀和版、双指针版，对照运行时间；再补两道真题确认自己能独立判断该用哪种走法。'
    prerequisites: ['python-function-basics', 'python-list-dict-cost']
    concepts: ['数组与顺序表', '前缀和与差分', '双指针与滑动窗口', '原地修改与额外空间']
    pitfalls: ['前缀和数组下标从 0 还是 1 开始搞混', '双指针在元素有负数时仍按单调性移动', '滑动窗口的右指针只加不减导致漏解']
    realworld: '子数组求和、连续区间计数这类题在省赛里出现频率最高，前缀和是它们的标准解法。'
    resources:
      - title: '《算法竞赛进阶指南》前缀和与差分（待核实具体章节）'
        type: 'book'
      - title: '洛谷题单：前缀和与差分（模板题起步）'
        type: 'article'
    status: '未开始'
    mastery: 0

  - id: 'stack-and-queue'
    title: '后进先出与先进先出'
    kind: '实操'
    objective: '能用栈与队列解题，并说出各自适用的题目特征'
    problem: '括号匹配为什么要用栈，滑动窗口最大值为什么要用队列——学生在没学之前只能靠背。一旦看清"最近进来的先处理"和"最早进来的先处理"这两种顺序，很多题的解法是自己冒出来的。这课的价值在讲清这两种顺序分别对应哪类题目，并亲手实现一遍。'
    practice: '讲练并重：用 Python 列表手写一个栈、用 collections.deque 写一个队列；再做括号匹配、表达式求值、滑动窗口最大值三题，其中滑动窗口必须用单调队列写。'
    prerequisites: ['linear-structures-two-pointers']
    concepts: ['栈的后进先出', '队列的先进先出与 deque', '单调栈', '单调队列', '用两个栈模拟队列']
    pitfalls: ['用 list.pop(0) 当队列用导致超时', '单调栈该弹出时没弹，栈里留下永远用不到的旧值', '忘记清空每轮之间的容器']
    realworld: '表达式求值、括号合法性校验是历年真题里的常客，编译器与计算器都靠这两条结构。'
    resources:
      - title: '《算法导论（第 3 版）》第 10 章 基本数据结构（栈与队列）'
        type: 'book'
      - title: 'Python 官方文档 collections.deque'
        type: 'official-doc'
        url: 'https://docs.python.org/3/library/collections.html#collections.deque'
    status: '未开始'
    mastery: 0

  - id: 'two-pointers-applications'
    title: '双指针：两个下标的配合'
    kind: '实操'
    objective: '能用对撞指针与快慢指针解去重、判定与配对类题目'
    problem: '一个下标不够用时学生往往再套一层循环，而很多题只需要第二个下标：有序数组里找一对和为目标值的数、原地去掉重复元素、判断是不是回文——多一个下标，循环就从平方降到线性。这课的价值在把"两个下标怎么配合"练成手感，并说清每个指针各自保证什么。'
    practice: '讲练并重：在有序数组里做两数之和、原地去重、回文判定、合并两个有序数组四题，每题都要写清两个指针各自的移动条件。'
    prerequisites: ['linear-structures-two-pointers']
    concepts: ['对撞指针', '快慢指针', '有序数组上的配対查找', '原地操作与额外空间', '与哈希解法的取舍']
    pitfalls: ['指针移动条件写成 if 而不是 while 导致漏解', '有序前提不成立时仍用对撞指针', '原地去重时忘记维护写入位置']
    realworld: '有序数据上的配对与去重是省赛的低难度高频题，写熟这两招能省下大量调试时间。'
    resources:
      - title: '《算法竞赛进阶指南》双指针与尺取法（待核实具体章节）'
        type: 'book'
      - title: '洛谷题单：双指针（模板题起步）'
        type: 'article'
    status: '未开始'
    mastery: 0

  - id: 'recursion-and-stack'
    title: '递归：函数调用自己'
    kind: '概念'
    objective: '能写出带正确基例与递归关系的递归函数，并说清调用过程'
    problem: '汉诺塔三根柱子六十四个盘子，手工列出步骤是不可能的，但递归解法只有六行——学生第一次看到通常会怀疑"它真的把每一步都做了吗"。这课的价值在讲清函数调用栈：递归每一步在栈里留下什么，基例为什么必须存在，以及为什么递归深度一超就崩。'
    practice: '以讲为主：手推汉诺塔三层与四层的完整调用过程（画出栈的变化），再亲手写出阶乘、斐波那契、递归求和三个函数并对照循环版。'
    prerequisites: ['stack-and-queue']
    concepts: ['递归三要素（基例、递归关系、向基例收敛）', '函数调用栈', '递归的返回路径', '递归与迭代的等价', 'Python 的递归深度上限']
