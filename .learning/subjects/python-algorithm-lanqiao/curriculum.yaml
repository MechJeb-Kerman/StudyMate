  # ===== 第五部分：动态规划与调优 =====

  - id: 'dp-from-recursion'
    title: '动态规划：把重复计算记下来'
    kind: '概念'
    objective: '能把递归解改成记忆化与递推版，并写清状态与转移方程'
    problem: '斐波那契的朴素递归，算到第四十个就要等好几秒——把递归树画出来才看得见，同一个子问题被算了成千上万次。动态规划的全部起点就是这一件事：把算过的答案记下来。这课的价值在讲清"状态、转移、边界"这三件套，并让学生亲手把递归一步步改造成递推。'
    practice: '以讲为主：同一道题（爬楼梯或数字三角形）写三版——朴素递归、记忆化搜索、自底向上递推，对照运行时间；再用打印把状态表画出来，确认每一格的含义。'
    prerequisites: ['recursion-and-stack', 'greedy-and-intervals']
    concepts: ['最优子结构', '重叠子问题', '记忆化搜索', '自底向上递推', '状态定义与转移方程', '边界与初始化', '时空复杂度分析']
    pitfalls: ['状态定义只写了一半，漏掉必要维度', '初始化写错（尤其第 0 项）导致整表偏移', '记忆化用的字典键漏了参数，两种状态混成一种']
    realworld: 'DP 是省赛区分度最高的题型，也是"能讲给别人"最容易被追问原理的地方。'
    resources:
      - title: '《算法导论（第 3 版）》第 15 章 动态规划'
        type: 'book'
    status: '未开始'
    mastery: 0

  - id: 'dp-knapsack'
    title: '背包：选与不选'
    kind: '实操'
    objective: '能手写 0/1 背包与完全背包，并说明遍历顺序为何不同'
    problem: '0/1 背包与完全背包的代码只差内层循环的方向，理解不深的人只能背下来——考场上稍一变形就写错。方向不同的原因就一句话：同一件物品能不能被重复选。这课的价值在讲清这一句话，并把背包从"容量"推广到各种伪装成背包的题上。'
    practice: '讲练并重：手写 0/1 背包（一维与二维各一版）、完全背包、分组背包；再用暴力枚举在小数据上对拍，确认遍历方向改错会立刻出错。'
    prerequisites: ['dp-from-recursion']
    concepts: ['0/1 背包与状态转移', '一维滚动数组与逆序遍历', '完全背包与正序遍历', '分组背包与多重背包', '恰好装满与不超过的区别']
    pitfalls: ['一维 0/1 背包写成正序遍历（变成完全背包）', '恰好装满时的非法状态没设为负无穷', '把"最多装"和"正好装"的初始化混用']
    realworld: '资源分配、预算取舍、任务装载类问题大多能化归成背包，变形多但骨架固定。'
    resources:
      - title: '《背包问题九讲》（崔添翼）—— 背包模型的中文经典综述'
        type: 'article'
      - title: '洛谷题单：动态规划的背包问题'
        type: 'article'
    status: '未开始'
    mastery: 0

  - id: 'dp-sequence-interval'
    title: '序列与区间的状态设计'
    kind: '实操'
    objective: '能设计序列与区间 DP 的状态，并写出转移方程'
    problem: '背包的状态是"容量"，序列题的状态则要自己设计——最长递增子序列要按"以谁结尾"定义状态，最长公共子序列要按"两个前缀"定义状态，区间合并要按"从哪断开"定义状态。学生第一次做这类题，卡住的地方几乎都在状态定义，而不在代码。这课的价值在练熟几种常见状态设计的套路。'
    practice: '讲练并重：做最长递增子序列（含 O(n log n) 版）、最长公共子序列、最长回文子序列、石子合并各一题；每题先写出状态定义与转移方程再动手写代码。'
    prerequisites: ['dp-knapsack', 'linear-structures-two-pointers']
    concepts: ['以 i 结尾的状态定义', '双序列的两维状态', '区间 DP 与断点枚举', '前缀最值优化', '把二维压成一维']
    pitfalls: ['状态定义不完整，转移时用不到需要的旧值', '区间 DP 的枚举顺序写反（小区间要先算）', 'LIS 的二分优化版与 DP 版混用导致答案错']
    realworld: '编辑距离、最长公共子序列、回文切分，是序列 DP 的固定考法，也是文本相似度工具的基础。'
    resources:
      - title: '洛谷题单：动态规划的线性与区间模型'
        type: 'article'
    status: '未开始'
    mastery: 0

  - id: 'lab-03-recommend-and-verify'
    title: '实验三：让助手推荐并验证'
    kind: '实验'
    objective: '做出推荐与验证链：题目文本进、候选算法出、跑通自动验证'
    problem: '这门课的配套项目——AI 刷题助手——到这一步该长出主干能力了：输入一段题目文本，由大模型分析题意并给出候选算法，再自动生成数据、对拍验证候选解。前三个部分学过的哈希、树、堆、并查集、图与搜索，正是判断"这题像哪一类"的依据；实验二的对拍脚本则是这次的验证模块。'
    practice: '以练为主：验收为主，产出是一次可重复运行的端到端脚本，讲解只针对接不上的那个环节。'
    prerequisites: ['hash-table', 'binary-tree-traversal', 'heap-and-priority-queue', 'union-find', 'graph-representation', 'dfs-bfs-search', 'binary-search-on-answer', 'greedy-and-intervals', 'lab-02-verify-by-brute-force']
    concepts: ['提示词与结构化输出', '把题目特征映射到算法族', '自动生成测试数据', '推荐结果的可信度判断']
    pitfalls: ['模型给的算法名与自己的实现接不上（只有名词，没有可执行方案）', '提示词没有约束输出格式，返回内容没法程序化解析', '只信模型推荐，不跑验证就当成答案']
    realworld: '这是本项目第一个真正"能用"的版本：题目进、候选算法出、自动验证收尾。'
    resources:
      - title: 'DeepSeek 开放平台 API 文档 —— 模型调用与结构化输出'
        type: 'official-doc'
        url: 'https://api-docs.deepseek.com/'
      - title: 'Python 官方文档 json —— 结构化结果解析'
        type: 'official-doc'
        url: 'https://docs.python.org/3/library/json.html'
    status: '未开始'
    mastery: 0

  - id: 'problem-pattern-recognition'
    title: '看数据规模挑算法'
    kind: '概念'
    objective: '能由数据范围与问法反查算法族，并说出选择的理由'
    problem: '考场上真正的困难常常不是写不出代码，而是不知道这题该往哪个方向想。数据范围其实一直在提示答案：范围到十的九次方，几乎只能是线性或对数；范围到几百，多半是三次方或区间 DP。这课的价值在把这条对应关系变成条件反射，并把学过的算法整理成一张可查的题型表。'
    practice: '以讲为主：收集十道做过的题，只看数据范围与问法就写出候选算法族，再对照题解检查自己的判断；把判断错的题单独记下来，找出是哪条线索漏了。'
    prerequisites: ['dp-from-recursion', 'greedy-and-intervals', 'lab-02-verify-by-brute-force']
    concepts: ['数据范围与复杂度上限的对应', '问法关键词（最多最少、是否、第 k、最优）', '常见算法族与适用特征', '复杂度与实现难度之间的取舍']
    pitfalls: ['只看题目像什么，不看数据规模', '一上来就写最复杂的解法', '把"数据小所以随便写"用到多组测试上']
    realworld: '同一道题在省赛里被设计成不同数据范围，就是要求选手用不同算法，读范围是第一步。'
    resources:
      - title: '《算法竞赛进阶指南》题型与复杂度对应（待核实具体章节）'
        type: 'book'
    status: '未开始'
    mastery: 0

  - id: 'constant-factor-tuning'
    title: '让 Python 再快一点'
    kind: '实操'
    objective: '能用常数优化把接近时限的解法压进时限内'
    problem: '同一份冒泡排序，用 Python 写比用 C 慢几十倍，所以"理论上够快"在 Python 里经常不够用。好在常数是可以压的：少一次函数调用、用 sys.stdin 整体读入而不是逐行 input、用列表做查表而不是分支判断。这课的价值在练熟几招能立竿见影的提速手段，并知道该先测哪一段。'
    practice: '讲练并重：拿一道接近时限的题，先测出耗时的瓶颈在哪一段，再依次应用三到四招优化，每招都记录耗时变化；最后对照同一算法的内置实现看还差多少。'
    prerequisites: ['python-list-dict-cost', 'lab-02-verify-by-brute-force']
    concepts: ['常数因子的来源', '局部变量的读取比全局快', 'sys.stdin 与逐行 input 的差别', '减少循环内的函数调用与属性查找', '用实测定位瓶颈']
    pitfalls: ['不测就猜瓶颈在哪', '为了优化牺牲正确性', '用递归写本来该迭代的大循环']
    realworld: 'Python 选手必须比 C++ 选手更懂常数，很多题的差距就在这几招上。'
    resources:
      - title: 'Python 官方文档 性能分析（profile 与 timeit）'
        type: 'official-doc'
        url: 'https://docs.python.org/3/library/profile.html'
      - title: 'Python 官方文档 性能技巧'
        type: 'official-doc'
        url: 'https://docs.python.org/3/tutorial/stdlib.html'
    status: '未开始'
    mastery: 0

  - id: 'stress-test-and-review'
    title: '交卷之前你要检查什么'
    kind: '实操'
    objective: '能在提交前用暴力解对拍并跑完边界数据自检'
    problem: '很多人不是不会做，而是交上去才发现多组数据没清空、答案要取模却忘了取、数组开小了。这些错误在样例上全都不会暴露。这课的价值在把"提交前自检"变成固定流程：暴力解对拍、边界数据齐跑、答案格式逐条核对。'
    practice: '讲练并重：给自己准备一份提交前检查清单；用它检查三道自己以前做错的题，找出当时漏掉的是哪一条。'
    prerequisites: ['lab-02-verify-by-brute-force']
    concepts: ['对拍器与随机数据', '边界情况清单（最小、最大、重复、退化）', '多组数据的清空', '取模与溢出', '答案格式与输出要求']
    pitfalls: ['参考解与候选解用同一个错误思路（假通过）', '随机数据范围与题目不一致，测了个寂寞', '只测小数据，忽略性能退化']
    realworld: '"过样例不等于过题"，自检流程是把正确率从碰运气变成稳定的关键。'
    resources:
      - title: 'Python 官方文档 random（造对拍数据）'
        type: 'official-doc'
        url: 'https://docs.python.org/3/library/random.html'
    status: '未开始'
    mastery: 0

  - id: 'lab-04-spaced-repetition-drill'
    title: '实验四：一次完整的赛前模拟'
    kind: '实验'
    objective: '能限时独立完成省赛难度真题，并讲清所用算法为何正确'
    problem: '前面几个部分把零件与工具都备齐了，但考场上是在时间压力下选题、决策、写码、自检。这次要按省赛节奏走一遍完整流程：读题、估规模、定算法、写完、自检，并且把每道题的解法讲清楚——这也是"能讲给别人"这条目标的第一次正式检验。'
    practice: '以练为主：验收为主，产出是限时完成的解题记录与讲解稿。'
    prerequisites: ['dp-from-recursion', 'dp-knapsack', 'dp-sequence-interval', 'binary-search-on-answer', 'greedy-and-intervals', 'problem-pattern-recognition', 'constant-factor-tuning', 'stress-test-and-review']
    concepts: ['限时选题策略', '解题记录与讲解稿', '把算法讲给别人的标准']
    pitfalls: ['把时间全花在一道难题上', '写对但来不及自检', '讲得出结论讲不出为什么正确']
    realworld: '蓝桥杯省赛就是在这套节奏里跑的，这一课直接对应考场表现。'
    resources:
      - title: '蓝桥杯官方练习系统（历年真题，Python 组）'
        type: 'article'
        url: 'https://www.lanqiao.cn/problems/'
    status: '未开始'
    mastery: 0

  - id: 'explain-like-a-teacher'
    title: '把算法讲给别人听'
    kind: '概念'
    objective: '能对一个算法讲清正确性、复杂度与被淘汰的数据规模'
    problem: '这门课的最终目标不是"我做过这道题"，而是"我能把这件事讲明白"。讲不明白，通常说明还有一层没吃透——比如说不清并查集路径压缩为什么摊还到近常数、说不清背包为什么必须逆序。这课的价值在给出一个可自查的讲解结构，并用它去拷问自己学过的每个算法。'
    practice: '以讲为主：从学过的算法里挑五个，各写一份三分钟讲解稿（为什么正确、复杂度怎么推、什么数据规模会被淘汰），并对着同学或录音讲一遍，记录被问住的地方。'
    prerequisites: ['lab-02-verify-by-brute-force', 'lab-04-spaced-repetition-drill']
    concepts: ['正确性论证的写法', '复杂度推导（含摊还分析入门）', '适用边界与失效条件', '把术语翻译成直觉']
    pitfalls: ['只会复述代码流程，讲不出为什么正确', '复杂度只会背结论不会推', '把"我记得是这样"当成论证']
    realworld: '面试、组队讨论、写题解，评价一个人算法水平的场合几乎都是要求把道理讲出来。'
    resources:
      - title: '《算法导论（第 3 版）》第 17 章 摊还分析（复杂度推导的进阶）'
        type: 'book'
    status: '未开始'
    mastery: 0

  - id: 'capstone-ai-tutor'
    title: '综合实战：把刷题助手做完'
    kind: '实验'
    objective: '做出端到端可用助手：题目文本进、推荐算法出、验证留证据'
    problem: '把整门课收束到配套项目上：题目文本进 → 大模型分析题意 → 推荐候选算法 → 自动对拍与样例验证 → 输出可复现的记录。这一课也是整套课程目标的总验收：既看工具能不能用，也看你能否讲清它内部每个环节为什么这样设计。'
    practice: '以练为主：验收为主，交付可重复运行的完整助手与一份说明，讲解只针对讲不清的环节。'
    prerequisites: ['lab-01-run-one-problem', 'lab-02-verify-by-brute-force', 'lab-03-recommend-and-verify', 'lab-04-spaced-repetition-drill', 'explain-like-a-teacher']
    concepts: ['端到端流程组织', '结果可复现与留证', '把算法知识做成工具']
    pitfalls: ['各模块单跑都好，串起来输入输出格式对不上', '没有留验证证据，无法判断推荐到底准不准', '只追求跑通，讲不清每个环节的设计取舍']
    realworld: '这就是本项目从最早一课的"能跑一道题"长成的最终形态，也是"能讲给别人"的实物证据。'
    resources:
      - title: '《算法竞赛进阶指南》综合训练（待核实具体章节）'
        type: 'book'
    status: '未开始'
    mastery: 0

